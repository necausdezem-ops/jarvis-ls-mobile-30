name: Build JARVIS Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Restore JARVIS source
        shell: bash
        run: |
          set -euo pipefail
          cat source/JARVIS-v3.1.b64part-* | base64 --decode > "$RUNNER_TEMP/JARVIS-v3.1.tar.xz"
          tar -xJf "$RUNNER_TEMP/JARVIS-v3.1.tar.xz" -C "$GITHUB_WORKSPACE"
          test -f JARVIS/settings.gradle.kts
          test -f JARVIS/app/build.gradle.kts

      - name: Compile debug APK
        run: gradle --no-daemon -p JARVIS :app:assembleDebug --stacktrace

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: JARVIS/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
